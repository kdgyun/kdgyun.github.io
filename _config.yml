about_content: > # this means to ignore newlines until the next config item.
  I conduct research in distributed and cloud computing with a focus on container orchestration. Specifically, my work centers on resource allocation optimization to minimize resource costs while ensuring a seamless user experience. <br><br>
  As a researcher, I pursue <mark>in-depth knowledge of my areas of interest</mark>. My research on Kubernetes resource and scheduling optimization, leveraging time-series and statistical analysis, has resulted in two publications in prestigious international conferences. I am proficient in managing cloud services like AWS and GCP, as well as operating on-premises clusters. 
  Recently, I have expanded my research into autoscaling and traffic scheduling in heterogeneous cluster environments and am preparing new papers in this domain.
  <br><br>
  As a developer, I pursue <mark>broad knowledge through diverse experiences</mark> and <mark>automation</mark> of repetitive tasks to enhance operational efficiency.
  I founded a startup by advancing a coding test platform that was recognized as an outstanding project at the SW Festival.
  Additionally, I served as the lead for Korea University’s open-source management platform project, gaining full-stack development experience.
  I have also developed various bootstrap and automation tools to eliminate inefficiencies and reduce wasted time caused by repetitive work. <br>

content:
  - title: <b>Notable Development Projects</b>
    layout: list
    content:
      - layout: left
        title: LARE-HPA
        link: https://github.com/kdgyun/LARE-HPA
        job_title: Kubernetes Autoscaler
        description: |
          * Source code for the paper presented at the <i>International Conference on Service-Oriented Computing 2024</i>.
          * An autoscaler that dynamically adjusts thresholds and cooldown times in Kubernetes based on workload adaptivity.
          * Addresses the cost issues of over-provisioning and user experience degradation caused by under-provisioning in static scalers.
          * Recognized as a Distinguished Paper at an SCIE-compatible Top-tier Conference (NRF-1 recognized by the National Research Foundation of Korea).
          * Patent application (No.10-2024-0128875) filed and software copyright (C-2024-043831) officially registered.

      - title: k8s-cluster-bootstrap
        link: https://github.com/kdgyun/k8s-cluster-bootstrap
        job_title: Automation Tool
        description: |
          * A development project for quickly and easily building Kubernetes clusters with a single command in an Ubuntu environment.
          * Open-source project supporting Kubernetes versions from 1.24.15 to 1.31.2.
          * Developed to simplify the installation process by addressing the complexities caused by dependencies such as kernel versions, container runtimes, and CNIs in the official Kubernetes documentation.

      - title: KUCODE
        link: https://github.com/KU-CODE-OSS/KUCODE
        job_title: Open Source Management Platform
        description: |
          * A platform project to support open-source software education and promote open-source activities at Korea University.
          * Designed to strengthen SW skills and problem-solving abilities by integrating with academic courses to encourage open-source utilization.
          * Facilitates code reviews among students to foster a sense of challenge while providing course instructors with convenient tools for managing open-source projects and conducting statistical analyses.
          * Developed a web service based on Django, Vue.js, and PostgreSQL, overseeing the project as the lead.

      - title: COU (COU Inc.)
        link: https://github.com/COUniv/COUDeploy
        job_title: Online Coding Judge Platform
        description: |
          * A project to build an open-source online judge platform that can be easily personalized by anyone.
          * Designed to provide a variety of algorithm and coding problems, enabling a range of services from basic problem-solving to tailored solutions for individual service models.
          * Simplified the development-build-deployment process using Docker for kickstart environments.
          * Recognized as an excellent work representing the school at the 2022 SW Festival.

  - title: <b>Research Projects</b>
    layout: list
    content:
      - layout: top-middle
        title: Platform built to support open-source software education and promote open-source activities under the National Program of Excellence in Software.
        quote: >
          Research Assistant and Project Manager
        description: |
          * Developed a platform for analyzing the use and development of open-source software to nurture talent with practical software development and application skills.
          * Operated infrastructure for analyzing development activities and building team projects by connecting with open-source software community developers.
          * Integrated the management system for open-source projects within the institution into a single service, providing information and supporting the development of step-by-step educational content.
          * <b>Keywords:</b> <i>Open Source, Django, Vue.js, Full-stack, Project Manager <br><br></i>

      - layout: top-middle
        title: Development of a smart aging public service platform and prevention of forest disasters using a forest information convergence cloud system
        quote: >
          Research Assistant
        description: |
          * Developed a converged service platform to provide optimized services for forest disaster management and forest healing.
          * Operated a resilient and efficient edge cloud system infrastructure by enhancing the Quality of Service (QoS) and automating resource management.
          * Developed AI-based adaptive autoscaling technology to ensure fair GPU allocation for GPU-intensive microservices in MSA-based forest information convergence services.
          * <b>Keywords:</b> <i>Edge Cloud, Resource Management, Autoscaling, Real-time Processing, High Availability <br><br></i>

      - layout: top-middle
        title: Development of an edge cloud-based vehicle sharing platform that supports user-specific automotive healthcare services
        quote: >
          Research Assistant
        description: |
          * Developed a converged service platform that quickly establishes a user-specific car environment and provides personalized services, even when the user switches vehicles.
          * Provided vehicle services, including emergency services, based on user-specific driving information (vehicle speed, driving records, driving habits, navigation data, battery usage and management, real-time location, and personalized vehicle settings), even when switching vehicles.
          * Developed adaptive resource scaling technology between vehicles and private cloud servers based on real-time service resource utilization.
          * <b>Keywords:</b> <i>Car Sharing Platform, Edge Cloud Computing, Automotive Healthcare, Driving Assistance Service, Convergence Service Platform <br><br></i>

